# =============================================================================
# nodelocaldns values
# 对齐上游 kubernetes/cluster/addons/dns/nodelocaldns/nodelocaldns.yaml。
# 镜像版本以上游 yaml 为准；占位符 __PILLAR__*__ 映射到下列配置项。
# =============================================================================

# 镜像（tag 以上游 nodelocaldns.yaml 为准）
image:
  repository: registry.k8s.io/dns/k8s-dns-node-cache
  tag: "1.27.1"
  pullPolicy: IfNotPresent

# 上游 PILLAR 占位符对应配置
config:
  dnsDomain: cluster.local        # __PILLAR__DNS__DOMAIN__
  localDNS: 169.254.20.10          # __PILLAR__LOCAL__DNS__
  dnsServer: 10.96.0.10            # __PILLAR__DNS__SERVER__
  clusterDNS: 10.96.0.10           # __PILLAR__CLUSTER__DNS__
  # __PILLAR__UPSTREAM__SERVERS__：集群外域名转发的上游 DNS（多个以空格分隔）。
  # 通常填节点 /etc/resolv.conf 中的上游地址，部署前按集群实际填写。
  upstreamServers: ""
  metricsPort: 9253
  healthPort: 8080

# 资源名对齐上游：node-local-dns
nameOverride: node-local-dns

serviceAccount:
  create: true
  name: node-local-dns

# 与上游一致：仅 requests，不设 limits。
resources:
  requests:
    cpu: 25m
    memory: 5Mi

priorityClassName: system-node-critical

tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
  - effect: NoExecute
    operator: Exists
  - effect: NoSchedule
    operator: Exists

nodeSelector: {}
affinity: {}
