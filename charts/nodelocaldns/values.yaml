# =============================================================================
# nodelocaldns values
# 适用于 Kubernetes 1.37 集群的 NodeLocal DNSCache 骨架配置。
# =============================================================================

image:
  # 多架构 manifest 列表；如节点为非 amd64，请按架构调整为对应后缀镜像。
  repository: registry.k8s.io/dns/k8s-dns-node-cache
  tag: "1.37.2"
  pullPolicy: IfNotPresent

config:
  # 节点上监听的本地缓存 IP（DaemonSet hostNetwork，勿与节点 IP 冲突）。
  listenIP: 169.254.20.10
  clusterDomain: cluster.local
  # 集群外部查询转发到节点本机 resolv.conf；集群内域名转发到集群 DNS Service。
  upstreamResolvConf: /etc/resolv.conf
  upstreamClusterDNS: 10.96.0.10
  cacheSuccess: 9984
  cacheDenial: 9984
  metricsPort: 9253

serviceAccount:
  create: true
  name: ""

resources:
  requests:
    cpu: 100m
    memory: 70Mi
  limits:
    memory: 170Mi

# 允许调度到 Master / 控制面节点。
tolerations:
  - operator: Exists
    effect: NoSchedule
  - operator: Exists
    effect: NoExecute

nodeSelector: {}
affinity: {}
priorityClassName: ""

# 额外挂载（例如节点 systemd-resolved 的 resolv.conf）。
extraVolumes: []
extraVolumeMounts: []
