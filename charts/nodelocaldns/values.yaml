# =============================================================================
# nodelocaldns values
# 以 Kubernetes 官方 addon 模板为准：
#   cluster/addons/dns/nodelocaldns/nodelocaldns.yaml
# 占位符与官方 PILLAR 对应关系：
#   __PILLAR__DNS__DOMAIN__      -> config.clusterDomain
#   __PILLAR__LOCAL__DNS__       -> config.localDNS
#   __PILLAR__DNS__SERVER__      -> config.dnsServer
#   __PILLAR__CLUSTER__DNS__     -> config.dnsServer
#   __PILLAR__UPSTREAM__SERVERS__-> config.upstreamServers
# =============================================================================

image:
  repository: registry.k8s.io/dns/k8s-dns-node-cache
  tag: "1.27.1"
  pullPolicy: IfNotPresent

config:
  # 集群域名
  clusterDomain: cluster.local
  # 节点本地缓存 IP（hostNetwork，勿与节点 IP 冲突）
  localDNS: 169.254.20.10
  # 集群 DNS Service IP（kube-dns / coredns ClusterIP）
  dnsServer: 10.96.0.10
  # 集群外部上游 DNS 服务器（.:53 段 forward 使用）
  upstreamServers:
    - 8.8.8.8
    - 8.8.4.4
  metricsPort: 9253
  healthPort: 8080

serviceAccount:
  create: true
  name: node-local-dns

resources:
  requests:
    cpu: 25m
    memory: 5Mi

priorityClassName: system-node-critical

# 与官方模板一致的容忍策略。
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
    effect: NoExecute
    operator: Exists
  - effect: NoSchedule
    operator: Exists

nodeSelector: {}
affinity: {}
