# =============================================================================
# nodelocaldns values
# 以上游 Kubernetes 官方 addon 为准：
#   cluster/addons/dns/nodelocaldns/nodelocaldns.yaml (master)
# 镜像 tag 以该 yaml 为准：registry.k8s.io/dns/k8s-dns-node-cache:1.27.1
# =============================================================================

namespace: kube-system

image:
  repository: registry.k8s.io/dns/k8s-dns-node-cache
  tag: "1.27.1"
  pullPolicy: IfNotPresent

config:
  # __PILLAR__DNS__DOMAIN__
  domain: cluster.local
  # __PILLAR__LOCAL__DNS__：节点本地缓存 IP
  localDNS: 169.254.20.10
  # __PILLAR__DNS__SERVER__：集群 DNS Service IP（与 clusterDNS 一致）
  dnsServer: 10.96.0.10
  # __PILLAR__CLUSTER__DNS__：集群内域名转发目标
  clusterDNS: 10.96.0.10
  # __PILLAR__UPSTREAM__SERVERS__：集群外域名上游，空格分隔多个；
  # 留空则回退读取节点 /etc/resolv.conf。
  upstreamServers: ""
  metricsPort: 9253
  healthPort: 8080

priorityClassName: system-node-critical

resources:
  requests:
    cpu: 25m
    memory: 5Mi

# 与上游 nodelocaldns.yaml 保持一致。
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
  - effect: NoExecute
    operator: Exists
  - effect: NoSchedule
    operator: Exists

nodeSelector: {}
affinity: {}
