# Headless Service：向 Prometheus 暴露 node-cache 指标。
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nodelocaldns.fullname" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    prometheus.io/port: {{ .Values.config.metricsPort | quote }}
    prometheus.io/scrape: "true"
  labels:
    k8s-app: node-local-dns
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: {{ .Values.config.metricsPort }}
      targetPort: {{ .Values.config.metricsPort }}
  selector:
    k8s-app: node-local-dns
