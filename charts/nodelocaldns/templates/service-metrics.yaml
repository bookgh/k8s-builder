# Headless Service，用于向 Prometheus 暴露 metrics。
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nodelocaldns.name" . }}
  namespace: {{ include "nodelocaldns.namespace" . }}
  annotations:
    prometheus.io/port: "{{ .Values.config.metricsPort }}"
    prometheus.io/scrape: "true"
  labels:
    {{- include "nodelocaldns.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: {{ .Values.config.metricsPort }}
      targetPort: {{ .Values.config.metricsPort }}
  selector:
    k8s-app: {{ include "nodelocaldns.name" . }}
