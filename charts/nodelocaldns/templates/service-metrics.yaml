# Headless Service，用于向 Prometheus 暴露 metrics.
apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/port: {{ .Values.config.metricsPort | quote }}
    prometheus.io/scrape: "true"
  labels:
    k8s-app: node-local-dns
  name: {{ include "nodelocaldns.name" . }}
  namespace: {{ .Release.Namespace }}
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: {{ .Values.config.metricsPort }}
      targetPort: {{ .Values.config.metricsPort }}
  selector:
    k8s-app: node-local-dns
