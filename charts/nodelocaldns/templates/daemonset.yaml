apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "nodelocaldns.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nodelocaldns.labels" . | nindent 4 }}
spec:
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 10%
  selector:
    matchLabels:
      k8s-app: node-local-dns
  template:
    metadata:
      labels:
        k8s-app: node-local-dns
      annotations:
        prometheus.io/port: {{ .Values.config.metricsPort | quote }}
        prometheus.io/scrape: "true"
    spec:
      priorityClassName: {{ .Values.priorityClassName }}
      serviceAccountName: {{ include "nodelocaldns.serviceAccountName" . }}
      hostNetwork: true
      # 上游默认 Default：不使用集群 DNS，避免与本地缓存循环。
      dnsPolicy: Default
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      containers:
        - name: node-cache
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          args:
            - "-localip"
            - "{{ .Values.config.localDNS }},{{ .Values.config.dnsServer }}"
            - "-conf"
            - /etc/Corefile
            - "-upstreamsvc"
            - kube-dns-upstream
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          ports:
            - name: dns
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.config.metricsPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              host: {{ .Values.config.localDNS }}
              path: /health
              port: {{ .Values.config.healthPort }}
            initialDelaySeconds: 60
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /run/xtables.lock
              name: xtables-lock
              readOnly: false
            - name: config-volume
              mountPath: /etc/coredns
            - name: kube-dns-config
              mountPath: /etc/kube-dns
      volumes:
        - name: xtables-lock
          hostPath:
            path: /run/xtables.lock
            type: FileOrCreate
        - name: kube-dns-config
          configMap:
            name: kube-dns
            optional: true
        - name: config-volume
          configMap:
            name: {{ include "nodelocaldns.fullname" . }}
            items:
              - key: Corefile
                path: Corefile.base
