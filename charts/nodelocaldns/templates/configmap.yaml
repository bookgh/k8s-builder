apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nodelocaldns.fullname" . }}
  labels:
    {{- include "nodelocaldns.labels" . | nindent 4 }}
data:
  Corefile: |
    {{ .Values.config.clusterDomain }}:53 {
        errors
        cache {
            success {{ .Values.config.cacheSuccess }} 30
            denial {{ .Values.config.cacheDenial }} 5
        }
        reload
        loop
        bind {{ .Values.config.listenIP }}
        forward . {{ .Values.config.upstreamResolvConf }} {
            max_concurrent 1000
        }
        prometheus 0.0.0.0:{{ .Values.config.metricsPort }}
    }
    .:53 {
        errors
        cache {
            success {{ .Values.config.cacheSuccess }} 30
            denial {{ .Values.config.cacheDenial }} 5
        }
        reload
        loop
        bind {{ .Values.config.listenIP }}
        forward . {{ .Values.config.upstreamClusterDNS }}
        prometheus 0.0.0.0:{{ .Values.config.metricsPort }}
    }
