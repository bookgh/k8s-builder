apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nodelocaldns.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    addonmanager.kubernetes.io/mode: Reconcile
data:
  Corefile: |
    {{ .Values.config.clusterDomain }}:53 {
        errors
        cache {
            success 9984 30
            denial 9984 5
        }
        reload
        loop
        bind {{ .Values.config.localDNS }} {{ .Values.config.dnsServer }}
        forward . {{ .Values.config.dnsServer }} {
            force_tcp
        }
        prometheus :{{ .Values.config.metricsPort }}
        health {{ .Values.config.localDNS }}:{{ .Values.config.healthPort }}
    }
    in-addr.arpa:53 {
        errors
        cache 30
        reload
        loop
        bind {{ .Values.config.localDNS }} {{ .Values.config.dnsServer }}
        forward . {{ .Values.config.dnsServer }} {
            force_tcp
        }
        prometheus :{{ .Values.config.metricsPort }}
    }
    ip6.arpa:53 {
        errors
        cache 30
        reload
        loop
        bind {{ .Values.config.localDNS }} {{ .Values.config.dnsServer }}
        forward . {{ .Values.config.dnsServer }} {
            force_tcp
        }
        prometheus :{{ .Values.config.metricsPort }}
    }
    .:53 {
        errors
        cache 30
        reload
        loop
        bind {{ .Values.config.localDNS }} {{ .Values.config.dnsServer }}
        forward . {{ range $i, $u := .Values.config.upstreamServers }}{{ if $i }} {{ end }}{{ $u }}{{ end }}
        prometheus :{{ .Values.config.metricsPort }}
    }
