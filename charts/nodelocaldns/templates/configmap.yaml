apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nodelocaldns.name" . }}
  namespace: {{ include "nodelocaldns.namespace" . }}
  labels:
    {{- include "nodelocaldns.labels" . | nindent 4 }}
data:
  Corefile: |
    {{ .Values.config.domain }}:53 {
        errors
        cache {
            success 9984 30
            denial 9984 5
        }
        reload
        loop
        bind {{ .Values.config.localDNS }} {{ .Values.config.dnsServer }}
        forward . {{ .Values.config.clusterDNS }} {
            force_tcp
        }
        prometheus :{{ .Values.config.metricsPort }}
        health {{ .Values.config.localDNS }}:{{ .Values.config.healthPort }}
    }
    in-addr.arpa:53 {
        errors
        cache 30
        reload
        loop
        bind {{ .Values.config.localDNS }} {{ .Values.config.dnsServer }}
        forward . {{ .Values.config.clusterDNS }} {
            force_tcp
        }
        prometheus :{{ .Values.config.metricsPort }}
    }
    ip6.arpa:53 {
        errors
        cache 30
        reload
        loop
        bind {{ .Values.config.localDNS }} {{ .Values.config.dnsServer }}
        forward . {{ .Values.config.clusterDNS }} {
            force_tcp
        }
        prometheus :{{ .Values.config.metricsPort }}
    }
    .:53 {
        errors
        cache 30
        reload
        loop
        bind {{ .Values.config.localDNS }} {{ .Values.config.dnsServer }}
        forward . {{ .Values.config.upstreamServers | default "/etc/resolv.conf" }}
        prometheus :{{ .Values.config.metricsPort }}
    }
